    command: [ "--migrate" ]
    environment:
      DbConnections__Postgres__ConnectionString: "User ID=postgres;Password=postgres;Host=postgres;Port=5432;Database=notifications;Pooling=true;Include Error Detail=true"
      Kafka__BootstrapServers: "kafka:29092"
      Kafka__ConsumerTopics__EmailConfirmation: "EmailConfirmation"
      Kafka__ConsumerGroupId: "svc-notifications"
      Email__FromAddress: "noreply@planara.ru"
      Email__SmtpServer: "smtp.yandex.com"
      Email__Port: "465"
      Email__Username: "Planara"
      Email__Password: "EMAIL_APPLICATION_PASSWORD"
      Email__EnableSsl: "false"
      Email__TemplatesPath: "templates"
      GraphQL__Name: "GraphQLSchema"
      
  privacy:
